name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wood-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: wood-backend/package.json
      - name: Install deps
        run: npm ci
      - name: Run tests
        run: npm test -- --runInBand
      - name: Lint
        run: npm run lint
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WoodFrontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: WoodFrontend/package.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
